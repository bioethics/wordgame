<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1d15" />
  <title>The Daily Proof — Great Work</title>
  <meta name="description" content="One word from sixteen sorts, ranked against every word they could have set." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❦</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;600;800&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="daily.css" />
</head>
<body>
  <div class="page">

    <!-- The title, the day's page of the almanac under it, and the number. -->
    <header class="masthead">
      <h1 class="mast-title"><button class="mast-house" id="modeBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="modeList" aria-label="Great Work: the modes">❦</button> The Daily Proof</h1>
      <nav class="mode-list" id="modeList" aria-label="Modes" hidden>
        <span class="mode-item mode-item--here" aria-current="page">Daily mode <span class="mode-tag">alpha</span></span>
        <a class="mode-item" id="modeHome" href="../?play=campaign">Campaign <span class="mode-tag">pre-alpha</span></a>
        <button class="mode-item mode-item--help" id="howtoBtn" type="button">How to play</button>
      </nav>
      <button class="almanac" id="almanac" type="button"></button>
      <nav class="mast-nav" aria-label="Challenges">
        <button id="prevBtn" class="nav-btn" aria-label="Previous challenge">‹</button>
        <div class="nav-num">
          <span id="numLabel">№ 1</span>
          <span id="dateLabel" class="nav-date"></span>
        </div>
        <button id="nextBtn" class="nav-btn" aria-label="Next challenge">›</button>
      </nav>
    </header>

    <!-- Who sits today, when anyone does: a patron, a choice of three, or the
         editor at the desk (deal.day in daily/deal.js). -->
    <section class="seats" id="seats" hidden></section>

    <!-- The proof sheet: Points × Mult = total, and the stick under it. -->
    <section class="sheet">
      <div class="readout" id="readout" aria-live="polite">
        <b class="ro-points" id="roPoints">0</b>
        <span class="ro-op ro-op--x">×</span>
        <b class="ro-mult" id="roMult">1</b>
        <div class="ro-chips" id="roChips"></div>
        <span class="ro-op ro-op--eq">=</span>
        <b class="ro-total" id="roTotal">0</b>
      </div>
      <!-- The stick, the measure engraved along its foot, and the knee that
           closes on the word's end (renderRule in js/render.js). -->
      <div class="stick-wrap" data-stick="0">
        <div class="stick" id="stick" aria-label="The word"></div>
        <div class="rule-bar" id="rule" aria-hidden="true"></div>
        <div class="knee" id="knee" aria-hidden="true"></div>
        <b class="stick-sum" id="stickSum0" hidden></b>
      </div>
      <!-- The second word, on a two-word day. -->
      <div class="stick-wrap" data-stick="1" hidden>
        <div class="stick" id="stick1" aria-label="The second word"></div>
        <div class="rule-bar" id="rule1" aria-hidden="true"></div>
        <div class="knee" id="knee1" aria-hidden="true"></div>
        <b class="stick-sum" id="stickSum1" hidden></b>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </section>

    <!-- The case: sixteen sockets, one per sort. A sort in the stick leaves its
         socket empty, so nothing moves under your thumb. -->
    <section class="case" aria-label="The case"><div class="case-grid" id="case"></div></section>

    <!-- The tool leads the row, the verbs beside it, Print hard right. -->
    <section class="bench">
      <button id="toolBtn" class="tool" hidden></button>
      <button id="clearBtn" class="btn">Clear</button>
      <button id="shuffleBtn" class="btn">Shuffle</button>
      <button id="printBtn" class="btn btn-print">Print</button>
    </section>

    <section class="result" id="result" hidden aria-live="polite"></section>

  </div>

  <div class="pop" id="pop" hidden></div>
  <!-- Where the print's floaters and sparkles rise (js/anim.js draws into it). -->
  <div id="fx" aria-hidden="true"></div>

  <dialog class="howto" id="howto" aria-labelledby="howtoTitle"></dialog>
  <script type="module" src="main.js"></script>
</body>
</html>
