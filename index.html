<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#150e18" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GREAT WORK — a word-forging game</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❦</text></svg>" />
  <script>
    // The saved room, layout and UI scale, applied before the stylesheet
    // paints so nothing flashes. js/appearance.js owns all three from the
    // moment the modules are up — its auto-fit is the authority; the formula
    // here only has to land close enough for the first frame.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('folio_settings_v1') || '{}');
        var de = document.documentElement;
        var look = typeof s.look === 'string' ? s.look : 'bench';
        de.dataset.look = look;
        if (typeof s.theme  === 'string') de.dataset.theme  = s.theme;
        // The bench keeps the Folio column under it (applyLayout in js/appearance.js).
        if (typeof s.layout === 'string') de.dataset.layout = look === 'bench' ? 'classic' : s.layout;
        var fitW = look === 'bench' ? 1300 : (s.layout === 'desk' ? 1720 : 1320);
        var fitH = look === 'bench' ? 900  : (s.layout === 'desk' ? 800  : 920);
        var ui = typeof s.uiScale === 'number' ? s.uiScale
          : Math.max(1, Math.min(innerWidth / fitW, innerHeight / fitH, 1.75));
        ui = Math.min(ui, Math.max(1, innerWidth / 1180));
        de.style.setProperty('--ui', String(Math.round(ui * 1000) / 1000));
      } catch (e) { /* first visit, or storage denied — the defaults hold */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,500&family=Inter:wght@400;600;800&family=Caveat:wght@500;700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <!-- The bench look, laid over the board above and keyed off html[data-look] -->
  <link rel="stylesheet" href="css/bench.css" />
</head>
<body>

  <header>
    <span class="logo">Great Work <span class="logo-mark">❦</span></span>
    <span id="dictDot" class="dict-dot" title="Dictionary"></span>
    <div class="header-spacer"></div>
    <div class="coin-purse" title="Coins"><span class="coin coin--lg"></span><span id="coinCount">0</span></div>
    <button id="manuscriptBtn" class="btn-icon btn-icon--manuscript" title="The manuscript — every word printed this run">❦</button>
    <button id="settingsBtn" class="btn-icon" title="Settings">⚙</button>
  </header>

  <main class="table">

    <!-- The ledger: status, the editor's demand, and the log. A real column in
         the Workshop layout; dissolved (display: contents) in the classic one. -->
    <div class="rail">

    <!-- Status: chapter · quota · resources -->
    <section class="status-row">
      <div class="status-card chapter-card">
        <span id="chapterLabel" class="chapter-label">Chapter I</span>
        <span id="chapterName" class="chapter-name">A Fresh Leaf</span>
        <span id="pageLabel" class="page-label">Page 1 <span class="page-of">of 3</span></span>
      </div>
      <div class="status-card quota-card" id="quotaCard">
        <div class="quota-top">
          <span class="quota-word">Quota</span>
          <span class="quota-nums"><b id="quotaNow">0</b><span class="quota-sep">/</span><span id="quotaTarget">35</span></span>
        </div>
        <div class="quota-bar"><div id="quotaFill" class="quota-fill"></div></div>
      </div>
      <div class="status-card pips-card">
        <div class="pips-row"><span class="pips-label">Words</span><span id="wordPips" class="pips"></span></div>
        <div class="pips-row"><span class="pips-label">Discards</span><span id="discardPips" class="pips"></span></div>
      </div>
      <!-- The bench look's sheet: one ruled line per word of the page, the
           word pips as their bullets (renderStatus in js/render.js). Retro
           keeps its pip row and never shows this. -->
      <div id="pageLines" class="page-lines" aria-label="The words of this page"></div>
    </section>

    <!-- The editor's bar: who holds the desk this Deadline, and their demand -->
    <section id="bossBar" class="boss-bar hidden" aria-live="polite"></section>

    <p id="log" class="log">Setting the type…</p>

    </div><!-- /rail -->

    <!-- The press: shelf, readout, groove, rack, actions. -->
    <div class="board">

    <!-- Patron shelf · the graveyard door · sundries workbench -->
    <section class="shelf-row">
      <div id="shelf" class="shelf" aria-label="Patrons"></div>
      <button id="ghostBtn" class="ghost-btn hidden" aria-label="Your ghosts"></button>
      <div id="sundries" class="sundries" aria-label="Sundries"></div>
    </section>

    <!-- Score readout: Points × the colour multipliers = total.
         The two sides are wrapped so the row can be a fixed three-track grid:
         a number growing a digit — which is exactly what a patron waking up
         does — then grows outward from its own operator instead of shoving the
         chips and the total sideways. -->
    <section id="readout" class="readout readout--idle" aria-live="polite">
      <div class="ro-side ro-side--in">
        <div class="slab slab--points"><span class="slab-label">Points</span><span id="roPoints" class="slab-num">0</span></div>
        <span class="ro-op">×</span>
      </div>
      <div class="ro-chips" aria-label="Colour multipliers">
        <span id="chip-length"  class="chip chip--length"  title="Length multiplier — 6-letter words earn ×2, +0.5 per letter beyond">×1</span>
        <span id="chip-crimson" class="chip chip--crimson" title="Crimson multiplier">×1</span>
        <span id="chip-azure"   class="chip chip--azure"   title="Azure multiplier">×1</span>
        <span id="chip-jade"    class="chip chip--jade"    title="Jade multiplier">×1</span>
        <span id="chip-amber"   class="chip chip--amber"   title="Amber multiplier">×1</span>
        <span id="chip-purple"  class="chip chip--purple"  title="Purple-trim multiplier">×1</span>
        <span id="chip-cursed"  class="chip chip--cursed"  title="Cursed-tile multiplier">×1</span>
        <span id="chip-explosive" class="chip chip--explosive" title="Squib lead — ×2 per explosive sort in the word, and then the charge goes off">×1</span>
        <span id="chip-bold"    class="chip chip--bold"    title="Set bold — the word is bracketed by a pair of rules">×1</span>
        <span id="chip-primed"  class="chip chip--primed"  title="Primed — a multiplier armed against this word before it was set">×1</span>
      </div>
      <div class="ro-side ro-side--out">
        <span class="ro-op">=</span>
        <div class="ro-total-wrap"><span id="roTotalPlain" class="ro-total ro-total--struck" hidden>0</span><span id="roTotal" class="ro-total">0</span></div>
      </div>
    </section>

    <!-- Word groove — in the bench look, the composing stick. The scale and
         the knee are drawn by renderRule (js/render.js); the wrap dissolves
         in retro, which hides both. -->
    <div class="groove-wrap">
      <div id="word" class="word-groove" role="list" aria-label="Current word" data-placeholder="compose a word…"></div>
      <div id="wordRule" class="rule-bar" aria-hidden="true"></div>
      <div id="wordKnee" class="knee" aria-hidden="true"></div>
    </div>

    <!-- Bag · rack · tray -->
    <section class="rack-row">
      <button id="bagBtn" class="pouch" title="Tiles waiting to be drawn">
        <span class="pouch-icon">
          <svg viewBox="0 0 48 52" class="pouch-svg" aria-hidden="true">
            <path d="M16 12 Q14 6 18 4 L30 4 Q34 6 32 12 Q44 18 44 34 Q44 48 24 48 Q4 48 4 34 Q4 18 16 12 Z" class="pouch-body"/>
            <path d="M15 12 Q24 17 33 12" class="pouch-cinch"/>
            <path d="M18 4 L30 4" class="pouch-cinch"/>
          </svg>
          <span id="bagCount" class="pouch-count">0</span>
        </span>
        <span class="pouch-label">Bag</span>
      </button>

      <div id="rack" class="rack" role="list" aria-label="Tile rack"></div>

      <button id="discardBtn" class="pouch" title="Tiles printed or discarded this page">
        <span class="pouch-icon">
          <svg viewBox="0 0 52 52" class="pouch-svg" aria-hidden="true">
            <path d="M6 22 L13 10 L39 10 L46 22 L46 40 Q46 44 42 44 L10 44 Q6 44 6 40 Z" class="tray-body"/>
            <path d="M6 22 L46 22" class="pouch-cinch"/>
            <path d="M20 10 L20 22 M32 10 L32 22" class="tray-slats"/>
          </svg>
          <span id="discardCount" class="pouch-count">0</span>
        </span>
        <span class="pouch-label">Discard</span>
      </button>
    </section>

    <!-- Actions -->
    <section class="action-row">
      <button id="btnDiscard" class="btn btn-discard" title="Swap tiles for fresh ones">
        <span class="btn-label">Discard</span><kbd>swap tiles for new</kbd>
      </button>
      <button id="btnShuffle" class="btn btn-quiet"><span class="btn-label">Shuffle</span><kbd>space</kbd></button>
      <button id="btnClear" class="btn btn-quiet"><span class="btn-label">Clear</span><kbd>esc</kbd></button>
      <div class="action-spacer"></div>
      <button id="btnPrint" class="btn btn-print btn-big"><span class="btn-label">Print</span><kbd>↵</kbd></button>
    </section>

    </div><!-- /board -->

  </main>

  <!-- FX layer (floaters, flying tiles, sparkles) -->
  <div id="fx" aria-hidden="true"></div>

  <!-- Popover (tap/long-press tile & patron details) -->
  <div id="popover" class="tip-pop hidden" role="tooltip"></div>

  <!-- Banner -->
  <div id="banner" aria-live="polite">
    <div class="banner-inner">
      <div class="banner-rule">❧</div>
      <div class="banner-title"></div>
      <div class="banner-sub"></div>
      <div class="banner-rule banner-rule--flip">❧</div>
    </div>
  </div>

  <!-- The Testing Chamber (a playtest bench, not part of the game) -->
  <div id="chamberModal" class="modal" role="dialog" aria-modal="true" aria-label="The Testing Chamber"></div>

  <!-- The Market -->
  <div id="marketModal" class="modal" role="dialog" aria-modal="true" aria-label="The Market"></div>

  <!-- The Black Market (a Colophon pick — the alley before the fair) -->
  <div id="blackMarketModal" class="modal modal--black" role="dialog" aria-modal="true" aria-label="The Black Market"></div>

  <!-- The Colophon (end-of-chapter upgrade pick) -->
  <div id="colophonModal" class="modal" role="dialog" aria-modal="true" aria-label="The Colophon"></div>

  <!-- The manuscript (every word printed this run, bound into chapters) -->
  <div id="manuscriptModal" class="modal" role="dialog" aria-modal="true" aria-label="The manuscript"></div>

  <!-- Inspector (bag / discard pile) -->
  <div id="inspectorModal" class="modal" role="dialog" aria-modal="true" aria-label="Tile inspector"></div>

  <!-- The ghosts (patrons The Ripper killed, still working) -->
  <div id="ghostModal" class="modal" role="dialog" aria-modal="true" aria-label="Your ghosts"></div>

  <!-- Game over / victory -->
  <div id="overlayModal" class="modal modal--center" role="dialog" aria-modal="true"></div>

  <!-- Settings -->
  <div id="settingsModal" class="modal" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="sheet sheet--settings">
      <div class="sheet-head">
        <h2>Settings</h2>
        <button class="x" id="settingsClose">✕</button>
      </div>

      <div class="set-row">
        <label>Look</label>
        <div class="set-control">
          <div id="lookPicker" class="appearance-swatches"></div>
        </div>
      </div>

      <div class="set-row">
        <label>Room</label>
        <div class="set-control">
          <div id="themeSwatches" class="appearance-swatches"></div>
        </div>
      </div>

      <div class="set-row" id="layoutRow">
        <label>Layout</label>
        <div class="set-control">
          <div id="layoutPicker" class="appearance-swatches"></div>
        </div>
      </div>

      <div class="set-row">
        <label for="uiScaleSlider">UI size</label>
        <div class="set-control scale-control">
          <label class="scale-auto"><input type="checkbox" id="uiScaleAuto" checked />Fit my screen</label>
          <input type="range" id="uiScaleSlider" min="0.85" max="1.75" step="0.05" value="1" />
          <span id="uiScaleLabel" class="set-value">100%</span>
        </div>
      </div>

      <div class="set-row">
        <label for="animSlider">Animation speed</label>
        <div class="set-control">
          <input type="range" id="animSlider" min="0.5" max="3" step="0.25" value="1" />
          <span id="animSpeedLabel" class="set-value">×1</span>
        </div>
      </div>

      <div class="set-row">
        <label for="soundToggle">Sound</label>
        <div class="set-control">
          <input type="checkbox" id="soundToggle" checked />
        </div>
      </div>

      <div class="set-row">
        <label>Word list</label>
        <div class="set-control set-control--stack">
          <label class="file-label">Load a .txt list<input id="fileInput" class="file-input" type="file" accept=".txt" /></label>
          <span id="dictStatus" class="set-note">loading…</span>
        </div>
      </div>

      <div class="set-row">
        <label>Run</label>
        <div class="set-control">
          <button id="btnNewRun" class="btn btn-danger">Abandon &amp; start anew</button>
        </div>
      </div>

      <details class="dev-tools">
        <summary>Developer</summary>
        <div class="dev-row">
          <button id="devChamber" class="btn btn-quiet">The Testing Chamber</button>
          <button id="devCoins" class="btn btn-quiet">+20 Coins</button>
          <button id="devMarket" class="btn btn-quiet">Open Market</button>
          <button id="devWinPage" class="btn btn-quiet">Clear page</button>
        </div>
      </details>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
