# Publishes the Daily Proof to its own subdomain.
#
# GitHub Pages serves one custom domain per repository, and this one already
# has great.julianandliesl.xyz, so the subdomain is a SECOND Pages site: a small
# repository holding nothing but the bundled page (tools/build-daily.mjs) and
# its CNAME. This job rebuilds that page whenever the daily or the parts of the
# game it reads change, and pushes it there.
#
# It does nothing until three things are set on THIS repository
# (Settings → Secrets and variables → Actions):
#   variable DAILY_PAGES_REPO   the site's repository, e.g. bioethics/daily-proof
#   variable DAILY_DOMAIN       the subdomain, e.g. daily.julianandliesl.xyz
#   secret   DAILY_DEPLOY_KEY   a private deploy key whose public half is added,
#                               with write access, to DAILY_PAGES_REPO
# The full setup, DNS included, is in README.md under "The Daily Proof".

name: Publish the Daily Proof

on:
  push:
    branches: [main]
    paths:
      - 'daily/**'
      - 'js/constants.js'
      - 'js/text.js'
      - 'js/excluded.js'
      - 'wordlists/wordlist.txt'
      - 'wordlists/excluded-slurs.txt'
      - 'tools/build-daily.mjs'
      - '.github/workflows/daily-subdomain.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ vars.DAILY_PAGES_REPO }}
      DOMAIN: ${{ vars.DAILY_DOMAIN }}
      CONFIGURED: ${{ vars.DAILY_PAGES_REPO != '' && vars.DAILY_DOMAIN != '' && secrets.DAILY_DEPLOY_KEY != '' }}
    steps:
      - name: Not configured yet
        if: env.CONFIGURED != 'true'
        run: echo "::notice::Set DAILY_PAGES_REPO, DAILY_DOMAIN and DAILY_DEPLOY_KEY to publish the Daily Proof (README.md, The Daily Proof)."

      - uses: actions/checkout@v4
        if: env.CONFIGURED == 'true'

      - uses: actions/setup-node@v4
        if: env.CONFIGURED == 'true'
        with:
          node-version: 20

      - name: Build the page
        if: env.CONFIGURED == 'true'
        run: |
          npm install --no-save esbuild
          node tools/build-daily.mjs --out dist-daily --cname "$DOMAIN"

      - name: Push it to the subdomain's repository
        if: env.CONFIGURED == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.DAILY_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/daily_key
          chmod 600 ~/.ssh/daily_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/daily_key -o IdentitiesOnly=yes"
          git clone --depth 1 "git@github.com:${TARGET}.git" site
          # The site is exactly the build: anything else in it is stale.
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist-daily/. site/
          cd site
          git add -A
          if git diff --cached --quiet; then echo "No change to publish."; exit 0; fi
          git -c user.name="Daily Proof" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish the Daily Proof from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push origin HEAD:main
